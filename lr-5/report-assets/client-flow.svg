<g font-size="21">
<text x="460" y="53">Запустить клиент</text>
<text x="460" y="167">Аргументы верны?</text>
<text x="130" y="167">Выход 2</text>
<text x="460" y="284">Подготовить запрос и соединиться</text>
<text x="460" y="376">Отправить запрос целиком</text>
<text x="460" y="464"><tspan x="460">Принять и разобрать ответ</tspan><tspan x="460" dy="26">GET — тело, HEAD — заголовки</tspan></text>
<text x="140" y="571"><tspan x="140">Зафиксировать</tspan><tspan x="140" dy="25">ошибку</tspan></text>
<text x="460" y="582">Сохранить результат попытки</text>
